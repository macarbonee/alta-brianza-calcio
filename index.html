<div id="boot" style="position:fixed;left:0;top:0;width:100%;height:100%;z-index:45;background:#0b1854"></div>
<script>
/* sfondo a triangoli dell'apertura: disegnato subito, identico a quello dell'animazione */
(function(){
  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  var shades=[[20,48,150],[26,58,170],[16,38,128],[32,70,190],[14,30,110],[24,52,160]];
  function build(W,H){var r=rng(1951),s=Math.max(70,Math.min(W,H)/5),h=s*0.866,tris=[];
    for(var row=-1;row*h<H+h;row++)for(var c=-1;c*s/2<W+s;c++){var x=c*s/2+(row%2?s/2:0),y=row*h,up=(c+row)%2===0;
      var p=up?[[x,y+h],[x+s/2,y],[x+s,y+h]]:[[x,y],[x+s,y],[x+s/2,y+h]];
      var b=shades[(r()*shades.length)|0];tris.push({p:p,b:b,ph:r()*6.28,sp:.6+r()*1.2,d:Math.hypot(x-W/2,y-H/2)})}
    return tris}
  function draw(cx,tris,t){
    for(var i=0;i<tris.length;i++){var o=tris[i];
      var wave=Math.max(0,1-Math.abs(o.d/420-(t*1.1-0.4)))*0.35, k=1+0.07*Math.sin(t*o.sp+o.ph)+wave;
      cx.fillStyle="rgb("+(o.b[0]*k|0)+","+(o.b[1]*k|0)+","+(Math.min(255,o.b[2]*k)|0)+")";
      cx.beginPath();cx.moveTo(o.p[0][0],o.p[0][1]);cx.lineTo(o.p[1][0],o.p[1][1]);cx.lineTo(o.p[2][0],o.p[2][1]);cx.closePath();cx.fill();
      cx.strokeStyle="rgba(255,255,255,.035)";cx.stroke()}}
  function fh(){var sa=navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);if(!sa)return innerHeight;var a=screen.width,b=screen.height,land=innerWidth>innerHeight;return Math.max(innerHeight,land?Math.min(a,b):Math.max(a,b))}
  function size(cv){var dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=fh(),cx=cv.getContext("2d");cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);return {cx:cx,W:W,H:H}}
  /* la stessa immagine che iPhone mostra all'avvio: se c'è, il passaggio è invisibile */
  function launchImg(){var sa=navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);if(!sa)return null;
    var d=Math.round(devicePixelRatio||1),k=Math.round(screen.width*d)+"x"+Math.round(screen.height*d);
    return ["640x1136","750x1334","828x1792","1080x2340","1125x2436","1170x2532","1179x2556","1206x2622","1242x2688","1284x2778","1290x2796","1320x2868"].indexOf(k)>=0?"icons/splash/s-"+k+".png":null}
  window.ABTRI={build:build,draw:draw,size:size,fh:fh,launchImg:launchImg};
  try{var bt=document.getElementById("boot");bt.style.height=fh()+"px"}catch(e){}
  /* Android: il tasto "Installa" vero si prepara subito */
  addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__bip=e;if(window.__bipcb)window.__bipcb()});
})();
</script>

/* prima si disegna la schermata d'avvio, poi (con lo stile pronto) si caricano i programmi in ordine */
(function(){
  var srcs=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js","config.js","logos.js","app.js"],i=0;
  function next(){if(i>=srcs.length)return;var el=document.createElement("script");el.src=srcs[i++];el.async=false;el.onload=next;el.onerror=next;document.body.appendChild(el)}
  window.__go=function(){window.__go=null;next()};
  if(window.__css)window.__go();
  setTimeout(function(){if(window.__go){var l=document.getElementById("mcss");if(l)l.media="all";window.__go()}},4000);
})();
</script>
